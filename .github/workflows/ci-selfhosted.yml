# SPDX-License-Identifier: GPL-3.0-or-later
#
# The live integration harness as a CI gate (tagwright Testing Standard, task
# #548). This runs on the self-hosted tagwright runner (labels tagwright,dind,
# self-hosted) whose jobs talk to an ISOLATED privileged dind over TLS
# (DOCKER_HOST/DOCKER_TLS_VERIFY/DOCKER_CERT_PATH are injected by the runner
# container, not set here), NEVER the production socket. run-all.sh stands up the
# DISPOSABLE Authentik (its own postgres/redis/server/worker on aboard-itest-net)
# inside that scratch dind, builds the real aboard binary, and drives it end to
# end. Everything is aboard-itest-* on the disposable stack; it never touches the
# production Authentik.
#
# Trigger discipline (CI Runner page): push and manual only, on org-owned
# branches, NEVER a fork pull_request, because a privileged self-hosted runner on
# a public repo must never execute outside code. Fork-PR coverage stays on the
# hosted leg (ci.yml, ubuntu-latest).
#
# Reversible: delete this file to remove the self-hosted leg entirely.

name: CI (self-hosted harness)

on:
  push:
    branches: [main]
  # Manual trigger, so the harness can be re-run from the Actions UI without a
  # code push (there is no other way to re-run a wedged self-hosted job).
  workflow_dispatch:

jobs:
  harness:
    # Must match the runner's LABELS set exactly (tagwright,dind,self-hosted);
    # a label the runner does not carry leaves the job Queued forever.
    runs-on: [self-hosted, tagwright, dind]
    env:
      GOPRIVATE: github.com/tagwright/*
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prove the isolated dind is reachable over TLS
        # A green here is the proof the job reached its scratch dind over
        # DOCKER_HOST/TLS (there is no host socket to fall back to).
        run: |
          docker version
          docker info

      - name: Run the live integration harness
        # run-all.sh brings up the disposable Authentik in the scratch dind,
        # builds the real aboard binary, and drives every socket-reachable
        # scenario (api, pass, golive) end to end, exercising the go-live poll.
        run: test/integration/run-all.sh
